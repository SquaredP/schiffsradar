<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13181c" media="(prefers-color-scheme: dark)">
<title>Schiffsradar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout wie beim Zugradar: Karte füllt den Schirm; oben Ort + Filterchips, unten Reiter und ein Blatt. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --line:#d3dbde; --fg:#152024; --muted:#5a6a70;
  --fracht:#1f64a8; --tanker:#b23a2e; --fahrgast:#1f8a4c; --dienst:#b86f06; --sonst:#7656a8;
  --late:#c8202f; --ontime:#1f8a4c; --focus:#0b6bcb; --pegel:#0a7e8c; --hafen:#2f4f8f; --club:#a8541a; --lock:#6a3fa0;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sign:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13181c; --surface:#1c2328; --line:#323c42; --fg:#e8eef0; --muted:#97a6ab;
  --fracht:#78b4ee; --tanker:#f0796c; --fahrgast:#55c486; --dienst:#e5a84a; --sonst:#b89ce2;
  --late:#f0616c; --ontime:#55c486; --focus:#7db8f5; --pegel:#4cc3d1; --hafen:#9db8ee; --club:#f0a96b; --lock:#c0a3ee; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.35 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:var(--bg);z-index:0}

.top{position:absolute;z-index:500;left:0;right:0;top:0;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;gap:8px}
/* kleines × im Feld „Mein Ort“: Ort zurücksetzen */
.stwrap{flex:1;min-width:0;position:relative;display:flex}
.stwrap .station{padding-right:46px}
.stx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--muted);font:400 24px/1 var(--ui);padding:0;display:grid;place-items:center}
.stx:active{background:var(--line)}
.stx[hidden]{display:none}
.station{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.station small{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;flex:none}
.station b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{flex:none;width:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:grid;place-items:center}
.icon svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.1);white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
.chip[aria-pressed="true"]{border-color:var(--c)}
.chip[aria-pressed="true"] i{opacity:1}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip.still{--c:var(--muted)}
.chip.still i{border-radius:50%;background:none;border:2px solid var(--c)}
.chip[aria-expanded="true"]{border-color:var(--fg)}
.menu{max-height:60dvh;overflow-y:auto;align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.22);padding:6px 4px;min-width:220px}
.menu h3{margin:4px 10px 2px;font:600 12px/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu i.ring{background:none!important;border:2px solid var(--muted)}
.menu label i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.menu input{width:18px;height:18px;margin:0}
.menu .hint{margin:4px 10px 6px;font-size:12px;max-width:260px}
.menu .all{display:flex;gap:8px;padding:4px 10px 6px}
.menu .all button{background:none;border:0;padding:4px 0;color:var(--focus);font-weight:500}
.pgm{position:absolute;left:0;top:0}
.pgm span{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;background:var(--surface);color:var(--fg);border:1.5px solid var(--pegel);
  border-radius:4px;padding:2px 5px;font:700 12px/1 var(--sign);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pgm span::before{content:"";width:7px;height:7px;background:var(--pegel);transform:rotate(45deg);flex:none}
.pgm span.dot{padding:4px}.pgm span.dot::before{margin:0}
.hfm{position:absolute;left:0;top:0}
.hfm span{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;background:var(--surface);color:var(--fg);border:1.5px solid var(--hafen);
  border-radius:7px;padding:2px 6px;font:700 11px/1.1 var(--sign);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.hfm span::before{content:"⚓";color:var(--hafen);font-size:12px}
.hfm span.dot{padding:3px 4px}.hfm span.dot b{display:none}
.pom{position:absolute;left:0;top:0}
.pom span{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;background:var(--surface);color:var(--fg);border:1.5px solid var(--pc);
  border-radius:7px;padding:2px 6px;font:700 11px/1.1 var(--sign);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pom span::before{content:attr(data-i);font-size:12px}
.pom span.dot{padding:3px 4px}.pom span.dot b{display:none}
.pom.club span{--pc:var(--club)}.pom.lock span{--pc:var(--lock)}
.wikibox{margin:12px 0 0;font-size:14px;line-height:1.45}.wikibox small{display:block;color:var(--muted);margin-top:4px}
.lineq{flex:none;width:130px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.status{align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.status.err{color:var(--late);border-color:var(--late)}
.track{align-self:flex-start;max-width:100%;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12);overflow:hidden}
.tbtn{min-width:0;background:none;border:0;padding:9px 4px 9px 14px;font:600 14px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tbtn::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.tstop{flex:none;background:none;border:0;padding:0 14px;font-size:22px;line-height:1;color:var(--muted)}
.news{align-self:flex-start;max-width:100%;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--focus);border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:13px;overflow:hidden}
.news button{background:none;border:0;padding:6px 10px;color:var(--fg);text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news b{color:var(--focus);font-weight:600}
.news .nx{color:var(--muted);padding:6px 12px 6px 6px}
.newsbox h3{font:600 15px/1.2 var(--ui);margin:14px 0 4px}
.newsbox h3:first-child{margin-top:0}
.newsbox ul{margin:0;padding-left:18px}.newsbox li{margin:3px 0}
.newslink{margin-top:14px;align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--focus);text-decoration:underline;font-weight:500}

/* Schiffe auf der Karte: Pfeil in Fahrtrichtung, liegende Schiffe als Kreis, Name ab Zoom 13 */
.sm{position:absolute;left:0;top:0}
.sm::after{content:"";position:absolute;left:-15px;top:-15px;width:30px;height:30px}
.sm svg{position:absolute;left:-8px;top:-10px;width:16px;height:20px;overflow:visible;transform-origin:50% 50%}
.sm.still svg{left:-6px;top:-6px;width:12px;height:12px}
.sm path,.sm circle{fill:var(--c);stroke:var(--surface);stroke-width:1.6;stroke-linejoin:round}
.sm.old path,.sm.old circle{fill:var(--surface);stroke:var(--c);stroke-dasharray:2.5 2}
.sm b{position:absolute;left:12px;top:-10px;font:700 12px/1 var(--sign);letter-spacing:.02em;padding:3px 5px;border-radius:4px;color:#fff;background:var(--c);
  border:1.5px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.sm.old b{background:var(--surface);color:var(--c);border:1.5px dashed var(--c)}
.sm.sel::before{content:"";position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:3px solid var(--focus);box-sizing:border-box}
.sm.sel b{font-size:14px;z-index:2}
.c-pegel{--c:var(--pegel)}
.c-hafen{--c:var(--hafen)}
.c-club{--c:var(--club)}
.c-lock{--c:var(--lock)}
.c-fracht{--c:var(--fracht)} .c-tanker{--c:var(--tanker)} .c-fahrgast{--c:var(--fahrgast)} .c-dienst{--c:var(--dienst)} .c-sonst{--c:var(--sonst)}
@media (prefers-color-scheme:dark){.sm b{color:#101416}}
.rlab{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);
  font:600 13px/1.2 var(--sign);padding:2px 7px;white-space:nowrap}
.rlab.dest{border-color:var(--c);color:var(--c)}
.rlab:before{display:none}
.leaflet-container{font-family:var(--ui);background:var(--bg)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.me{width:14px;height:14px;border-radius:50%;background:var(--focus);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--focus);transform:translate(-50%,-50%);position:absolute}
.pin{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--fg);background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--fg)}

/* Blatt */
.sheet{position:relative;z-index:600;background:var(--surface);border-top:1px solid var(--line);max-height:62dvh;display:flex;flex-direction:column;
  box-shadow:0 -6px 18px rgba(0,0,0,.14);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.sheet header h2{flex:1;min-width:0;margin:0;font:600 17px/1.2 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet header h2 span{color:var(--muted);font-weight:400}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted)}
.body{overflow-y:auto;min-height:0;padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.badge{flex:none;font:700 15px/1 var(--sign);letter-spacing:.02em;padding:5px 7px;border-radius:5px;background:var(--c);color:#fff;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme:dark){.badge{color:#101416}}
.nowrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.now{font-weight:500;min-width:0;flex:1}
.now small{display:block;color:var(--muted);font-weight:400}
.speed{flex:none;text-align:right;font:700 30px/1 var(--sign);letter-spacing:.01em}
.speed small{display:block;margin-top:3px;font:500 11px/1.2 var(--ui);color:var(--muted);letter-spacing:0}
.late{color:var(--late);font-weight:600} .ok{color:var(--ontime);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:500}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn.pri{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn:disabled{opacity:.6}
.field{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.favbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.favbox p{flex:1;min-width:12em;margin:0;color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:14px;font-size:14px}

.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:58px auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:9px 0}
.row .t{font:600 15px/1.1 var(--ui)}
.row .t small{display:block;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
.row .t small.now{color:var(--ontime)}
.row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.row .g{color:var(--muted);font-size:13px;white-space:nowrap}
.sub{margin:2px 0 -4px;font:600 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);margin:0}
.check{display:flex;gap:8px;align-items:center}
.pegel{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--fg)}
.pegel b{font:700 26px/1 var(--sign)}
.pegel small{display:block;color:var(--muted)}
.fav{border-top:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:8px}
.fav .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.fav .open p{flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav .open p small{display:block;color:var(--muted)}

nav{position:relative;z-index:600;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:11px 4px 10px;font-weight:500;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--fg);border-top-color:var(--fg)}
/* Handy: Detailblatt in drei Stufen (kompakt, halb, voll) per Ziehgriff; solange es offen ist, geben Filterleiste und Statuszeile der Karte den Platz zurück */
.sheet .grab{display:none}
@media not all and (min-width:900px) and (min-height:520px) and (orientation:landscape){
  .sheet{transition:max-height .22s ease}
  .sheet[data-snap=peek]{max-height:max(34dvh,190px)}
  .sheet[data-snap=full]{max-height:88dvh}
  .sheet .grab{display:block;width:100%;height:22px;margin:0;padding:0;background:none;border:0;touch-action:none;flex:none}
  .sheet .grab span{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0}
  .sheet header{padding-top:2px}
  #app:has(.sheet:not([hidden])) .chips,#app:has(.sheet:not([hidden])) .status{display:none}
}
/* Notebook und iPad im Querformat: Detailblatt rechts neben der Karte statt darunter, damit die Karte die volle Höhe behält */
@media (min-width:900px) and (min-height:520px) and (orientation:landscape){
  #app{display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,34vw,460px);grid-template-rows:minmax(0,1fr) auto}
  #map,.top{grid-column:1/-1;grid-row:1}
  nav{grid-column:1/-1;grid-row:2}
  .sheet{grid-column:2;grid-row:1;max-height:none;min-height:0;border-top:0;border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.14)}
  #app:has(.sheet:not([hidden])) #map,#app:has(.sheet:not([hidden])) .top{grid-column:1}
  .top .bar{max-width:560px}
  .badge{max-width:30vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bar">
      <div class="stwrap"><button class="station" id="placeBtn" type="button"><small>Mein Ort</small><b id="placeName">wählen</b></button><button class="stx" id="placeClear" type="button" aria-label="Ort zurücksetzen" hidden>×</button></div>
      <button class="icon" id="locBtn" type="button" aria-label="Karte auf meinen Standort zentrieren">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" id="typeBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="typeTxt">Typen</span> ▾</button>
      <button class="chip c-sonst" id="seaChip" type="button" aria-pressed="true"><i></i>Zeichen</button>
      <button class="chip c-pegel" id="pegelChip" type="button"><i></i>Pegel</button>
      <button class="chip c-hafen" id="portChip" type="button" aria-pressed="true"><i></i>Häfen</button>
      <button class="chip c-club" id="clubChip" type="button" aria-pressed="true"><i></i>Vereine</button>
      <button class="chip c-lock" id="lockChip" type="button" aria-pressed="true"><i></i>Schleusen</button>
      <input class="lineq" id="shipQ" type="search" placeholder="Name oder MMSI" enterkeyhint="search" autocomplete="off" aria-label="Nach Schiffsname oder MMSI filtern">
    </div>
    <div class="menu" id="menu" hidden></div>
    <div class="status num" id="status" role="status">Lade Schiffe …</div>
    <div class="news" id="hint" hidden><button id="hintOpen" type="button"><b>Hinweis: </b>Schiffe erscheinen ab Zoom 11 (ca. 20 km Umkreis) und werden nur für den sichtbaren Ausschnitt geladen.</button><button class="nx" id="hintX" type="button" aria-label="Hinweis schließen">×</button></div>
    <div class="news" id="news" hidden><button id="newsOpen" type="button"></button><button class="nx" id="newsX" type="button" aria-label="Hinweis schließen">×</button></div>
    <div class="track" id="track" hidden><button class="tbtn" id="trackOpen" type="button" aria-label="Verfolgtes Schiff anzeigen"></button><button class="tstop" id="trackStop" type="button" aria-label="Verfolgung beenden">×</button></div>
  </div>

  <div id="map"></div>

  <section class="sheet" id="sheet" hidden data-snap="half">
    <button class="grab" id="shGrab" type="button" aria-label="Blatt größer oder kleiner machen"><span></span></button>
    <header><span class="badge" id="shBadge" hidden></span><h2 id="shTitle"></h2><button class="x" id="shClose" type="button">Schließen</button></header>
    <div class="body" id="shBody"></div>
  </section>

  <nav>
    <button type="button" data-tab="map" aria-current="true">Karte</button>
    <button type="button" data-tab="pass">Mein Ort</button>
    <button type="button" data-tab="fav">Meine Schiffe</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== PURE ===== */
const CATS={fracht:'Fracht',tanker:'Tanker',fahrgast:'Fahrgast',dienst:'Dienst · Schlepper',sonst:'Sport · Sonstige'};
const CAT_ORDER=['fracht','tanker','fahrgast','dienst','sonst'];

  favs:store.get('favs',[]),
  onlyPlace:false,placeShips:new Set(),
  query:'',queryRaw:'',found:[],

  sel:null,        // {m,follow,dest,showData}

};
const favSet=()=>new Set(state.favs.map(f=>f.m));

/* ---------- Karte ---------- */
const start=state.place?[state.place.lat,state.place.lon]:[49.4794,8.4699];
const v0=store.get('view',{c:start,z:12});
const map=L.map('map',{zoomControl:false,attributionControl:true,doubleClickZoom:false}).setView(v0.c,v0.z);
map.attributionControl.setPrefix(false);
const dark=matchMedia('(prefers-color-scheme: dark)');
let base=null;
function setBase(){

setBase();dark.addEventListener('change',setBase);
const seaTiles=L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',
  {maxZoom:19,maxNativeZoom:18,attribution:''});
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const markers=new Map();
let meMarker=null,placeMarker=null,route=null;

/* ---------- Daten ---------- */
/* Schiffe erst ab diesem Zoom (ca. 20 km Breite auf dem Handy) und nur für den sichtbaren Ausschnitt */
const MIN_ZOOM=11;
const LIVE='https://ais.openwaters.io/v1/vessels';
let loadingData=false,liveFailAt=0,lastFile=0;
const toSec=v=>{if(v==null)return null;if(typeof v==='number')return v>1e12?v/1000:v;const t=Date.parse(v);return isNaN(t)?null:t/1000;};
const num=v=>typeof v==='number'&&isFinite(v)?v:null;
function typeNum(t){
  if(num(t)!=null)return t;
  const x=String(t||'').toLowerCase();
  if(/passenger/.test(x))return 60;if(/cargo/.test(x))return 70;if(/tanker/.test(x))return 80;if(/tug|towing/.test(x))return 52;
  if(/pilot/.test(x))return 50;if(/sail/.test(x))return 36;if(/pleasure/.test(x))return 37;if(/fishing/.test(x))return 30;return 0;
}
/* Kielwasser auf dem Gerät: neuen Punkt nur bei spürbarer Bewegung */
function addTrack(s,prev){
  const tr=prev&&prev.tr?prev.tr.slice():[],n=tr.length;
  if(n>=3&&dist([tr[n-3],tr[n-2]],[s.lat,s.lon])<30)return tr.length?tr:undefined;
  tr.push(s.lat,s.lon,s.ts);

}
function parseLive(j,prev){
  const ships=new Map(),now=nowSec();
  for(const f of(j&&Array.isArray(j.features)?j.features:[])){
    const c=f.geometry&&f.geometry.coordinates,p=f.properties||{};
    if(!c||!isFinite(c[0])||!isFinite(c[1])||!Number.isInteger(p.mmsi))continue;
    const sog=num(p.sog),cog=num(p.cog),hdg=num(p.heading);
    const s={m:p.mmsi,n:p.name?String(p.name).trim():undefined,t:typeNum(p.type),lat:c[1],lon:c[0],ts:toSec(p.seen)||now,cls:p.class||undefined,
      sog:sog!=null&&sog<102.2?sog:null,cog:cog!=null&&cog<360?cog:null,hdg:hdg!=null&&hdg<360?hdg:null,st:num(p.nav_status)};
    const o=prev.get(s.m);
    if(o){if(!s.n)s.n=o.n;if(!s.t)s.t=o.t;s.d=o.d;s.eta=o.eta;s.l=o.l;s.w=o.w;s.dr=o.dr;s.imo=o.imo;s.cs=o.cs;s.o=o.o;}
    s.tr=addTrack(s,o);
    s.cat=catOf(s.t);s.name=s.n||'MMSI '+s.m;ships.set(s.m,s);
  }
  /* Verfolgtes und gemerkte Schiffe bleiben, auch wenn sie den Ausschnitt verlassen haben */
  const keep=new Set(state.favs.map(f=>f.m));if(state.sel)keep.add(state.sel.m);
  for(const m of keep)if(!ships.has(m)&&prev.has(m))ships.set(m,prev.get(m));
  return ships;
}
/* Ziel, Ankunft, Abmessungen und Start kommen nicht aus den Live-Daten. Die Seite liest sie aus data/ships.json (Sammler, aisstream)
   und legt sie über die Live-Schiffe. Start = Stelle, an der das Schiff zuletzt still lag (Sammler 24/7, dazu eigene Beobachtung auf dem Gerät). */
const statics=new Map(),origins=new Map(store.get('orig',[]).map(a=>[a[0],a.slice(1)]));
let staticAt=0,staticBusy=false;
const STATIC_KEYS=['d','eta','l','w','dr','imo','cs'];
function applyStatics(){
  for(const s of state.ships.values()){
    const st=statics.get(s.m);if(!st)continue;
    for(const k of STATIC_KEYS)if(s[k]==null&&st[k]!=null)s[k]=st[k];
    if(!s.n&&st.n){s.n=st.n;s.name=st.n;}
    if(!s.t&&st.t){s.t=st.t;s.cat=catOf(s.t);}
    if(st.o&&(!s.o||st.o[2]>s.o[2]))s.o=st.o;
  }
}
async function loadStatic(){
  if(staticBusy||Date.now()-staticAt<300000||document.hidden)return;
  staticBusy=true;
  try{
    const r=await fetch('data/ships.json?t='+Math.floor(Date.now()/300000),{cache:'no-cache'});
    if(r.ok){const j=await r.json();statics.clear();for(const x of(Array.isArray(j.ships)?j.ships:[]))if(Number.isInteger(x.m))statics.set(x.m,x);applyStatics();if(state.sheet==='ship')renderShipSheet();}
  }catch(e){}
  staticAt=Date.now();staticBusy=false;
}
function noteOrigins(){
  let ch=false;
  for(const s of state.ships.values())if(isStill(s)&&s.ts!=null){const o=origins.get(s.m);if(!o||o[2]<s.ts){origins.set(s.m,[s.lat,s.lon,s.ts]);ch=true;}}
  if(ch){const cut=nowSec()-48*3600;for(const[k,v]of origins)if(v[2]<cut)origins.delete(k);}
}
/* Start der aktuellen Fahrt: zuletzt liegend gesehen, aber nicht dort, wo das Schiff jetzt liegt */
function originOf(s){
  if(isStill(s))return null;
  let o=s.o,mine=origins.get(s.m);
  if(mine&&(!o||mine[2]>o[2]))o=mine;
  if(!o||dist([o[0],o[1]],[s.lat,s.lon])<400)return null;
  return{ll:[o[0],o[1]],ts:o[2]};
}
/* Orte benennen (Nominatim, gecacht) */
const revCache=store.get('rev',{});
async function revName(ll){
  const key=ll[0].toFixed(3)+','+ll[1].toFixed(3);
  if(key in revCache)return revCache[key];
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=de&lat='+ll[0].toFixed(5)+'&lon='+ll[1].toFixed(5));
    const j=await r.json(),a=j.address||{};
    const n=j.name||a.industrial||a.harbour||a.suburb||a.village||a.town||a.city||null,c=a.city||a.town||a.village||'';
    revCache[key]=n?(c&&n!==c?n+', '+c:n):null;store.set('rev',revCache);return revCache[key];
  }catch(e){return undefined;}
}
let shipsSavedAt=0;
function saveShips(){
  if(Date.now()-shipsSavedAt<15000)return;shipsSavedAt=Date.now();
  kv.set('ships',{at:Date.now(),src:state.src,ships:[...state.ships.values()].map(({_sn,...r})=>r)});
  store.set('orig',[...origins].slice(-4000).map(([k,v])=>[k,...v]));
}
async function loadLive(){
  const b=map.getBounds().pad(.2);
  const u=LIVE+'?bbox='+[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(x=>x.toFixed(4)).join(',')+'&max_age=90m';
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),20000);
  let r;try{r=await fetch(u,{signal:ctl.signal,headers:{accept:'application/json'}});}finally{clearTimeout(timer);}
  if(r.status===429)throw new Error('zu viele Anfragen (429)');
  if(!r.ok)throw new Error('Serverfehler '+r.status);
  const j=await r.json();
  state.ships=parseLive(j,state.ships);
  state.meta={ok:true,live:true,generated:Math.floor(Date.now()/1000),truncated:!!j.truncated};
  applyStatics();noteOrigins();loadStatic();
  state.err=null;state.lastOk=Date.now();state.fresh=true;saveShips();
}
async function loadFile(){
  let r;
  try{r=await fetch('data/ships.json?t='+Math.floor(Date.now()/60000),{cache:'no-cache'});}catch(e){throw new Error('keine Verbindung');}
  if(r.status===404)throw new Error('missing');
  if(!r.ok)throw new Error('Serverfehler '+r.status);
  const j=await r.json(),ships=new Map();
  for(const s of(Array.isArray(j.ships)?j.ships:[])){
    if(s.lat==null||s.lon==null||s.ts==null)continue;
    s.cat=catOf(s.t);s.name=s.n||'MMSI '+s.m;ships.set(s.m,s);
  }
  state.ships=ships;state.meta=j;state.err=null;state.lastOk=Date.now();lastFile=Date.now();state.fresh=true;noteOrigins();saveShips();
}
async function loadData(){
  if(document.hidden||loadingData)return;
  if(state.src==='live'&&map.getZoom()<MIN_ZOOM){render();return;}   // nichts abfragen, solange man herausgezoomt ist
  loadingData=true;
  try{
    if(state.src==='live'||Date.now()-liveFailAt>300000){
      try{await loadLive();state.src='live';}
      catch(e){if(e.name==='AbortError')return;liveFailAt=Date.now();state.src='file';state.liveErr=e.message;}
    }
    if(state.src==='file'&&Date.now()-lastFile>55000)await loadFile();
    render();
    if(state.sheet==='ship')renderShipSheet();
    else if(state.sheet==='pass')paintPass(true);
    else if(state.sheet==='fav')renderFavs();
  }catch(e){
    state.err=e.message==='missing'?'Keine Live-Schiffsdaten erreichbar und noch keine Datei veröffentlicht (siehe README).'
      :'Schiffsdaten: '+(e.message||'Fehler')+'. Neuer Versuch in einer Minute.';
    setStatus(state.err,true);
  }finally{loadingData=false;}
}
function setStatus(text,err){const s=$('status');s.textContent=text;s.classList.toggle('err',!!err);}
function note(text,err,ms){state.note={text,err:!!err,until:Date.now()+ms};setStatus(text,!!err);}
function statusLine(shown){
  const m=state.meta;if(!m)return null;
  if(state.cacheAt&&!state.fresh&&map.getZoom()>=MIN_ZOOM)return['Gespeicherter Stand von '+hhmm(state.cacheAt)+' · '+shown+(shown===1?' Schiff':' Schiffe')+' · aktuelle Daten werden geladen …',false];
  if(m.ok===false&&m.reason==='no-key')return['Datenquelle noch nicht eingerichtet: Es fehlt der API-Schlüssel für aisstream.io (siehe README).',true];
  if(m.live){let t='Live · Stand '+hhmm(m.generated*1000)+' · '+shown+(shown===1?' Schiff':' Schiffe');if(m.truncated)t+=' · Ausschnitt voll, näher heranzoomen';if(state.query&&!shown)t='Kein Schiff „'+state.queryRaw+'“ im Ausschnitt.';return[t,false];}
  const gen=m.generated*1000,age=(Date.now()-gen)/60000;
  if(age>45)return['Daten von '+new Date(gen).toLocaleString('de-DE',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+'. Der Sammler läuft gerade nicht.',true];
  if(m.ok===false)return['Gerade keine AIS-Meldungen empfangen'+(m.error?' ('+m.error+')':'')+'.',true];
  let t='Stand '+hhmm(gen)+' · '+shown+(shown===1?' Schiff':' Schiffe');
  if(state.query&&!shown)t='Kein Schiff „'+state.queryRaw+'“ im Ausschnitt. Enter sucht überall.';
  return[t,false];
}

/* ---------- Darstellung ---------- */
function passes(s,favs){
  if(!state.cats.has(s.cat))return false;
  if(!state.still&&isStill(s)&&!favs.has(s.m))return false;
  if(!matches(s,state.query))return false;
  if(state.onlyPlace&&!state.placeShips.has(s.m))return false;
  return true;
}
function iconFor(s,p,sel,fav,label){
  const still=isStill(s)||courseOf(s)==null,old=p.age>STALE,c=courseOf(s);
  const rot=still?0:Math.round(c/5)*5;
  const name=(fav?'★ ':'')+s.name;
  const key=[s.cat,still,old,rot,sel,fav,label&&name].join('|');
  return{key,make:()=>{
    const span=el('span','sm c-'+s.cat+(still?' still':'')+(old?' old':'')+(sel?' sel':''));
    span.innerHTML=still?'<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6"/></svg>'
      :'<svg viewBox="0 0 16 20" style="transform:rotate('+rot+'deg)"><path d="M8 1 15 19 8 14.5 1 19Z"/></svg>';
    if(label)span.appendChild(el('b',null,name));
    return L.divIcon({className:'',html:span.outerHTML,iconSize:[0,0]});
  }};
}
let lastShown=0,attrCur='';
/* Rechteinhaber nur für die Daten nennen, die gerade auf der Karte zu sehen sind */
function paintAttrib(){
  try{
    const parts=[];
    if(map.hasLayer(seaTiles))parts.push('Seezeichen: © OpenSeaMap');
    if(gaugeLayer.getLayers().length)parts.push('Pegel: © WSV');
    if(lastShown>0)parts.push('Schiffe: '+(state.src==='file'?'aisstream.io':'Open Waters AIS'));
    const t=parts.join(' · ');
    if(t===attrCur)return;
    if(attrCur)map.attributionControl.removeAttribution(attrCur);
    if(t)map.attributionControl.addAttribution(t);
    attrCur=t;
  }catch(e){}
}
function render(){
  const now=nowSec(),favs=favSet(),z=map.getZoom(),bounds=map.getBounds().pad(.15),sel=state.sel,gated=z<MIN_ZOOM;
  const list=[];
  for(const s of state.ships.values()){
    const isSel=!!sel&&sel.m===s.m;
    if(!isSel&&(gated||!passes(s,favs)))continue;
    const p=shipPos(s,now);
    if(!isSel&&!bounds.contains(p.ll))continue;
    list.push({s,p,isSel,fav:favs.has(s.m)});
  }
  /* Bei vielen Schiffen: verfolgte, gemerkte, fahrende und große zuerst */
  const rank=x=>(x.isSel?0:x.fav?1:isStill(x.s)?3:2);
  list.sort((a,b)=>rank(a)-rank(b)||(b.s.l||0)-(a.s.l||0));
  const seen=new Set();
  lastShown=list.length;setTimeout(paintAttrib,0);
  if(sel){const x=list.find(y=>y.isSel);if(x&&!passes(x.s,favs))lastShown--;}
  for(const x of list.slice(0,600)){
    const{s,p,isSel,fav}=x;seen.add(s.m);
    const ic=iconFor(s,p,isSel,fav,z>=13||isSel||fav);
    let m=markers.get(s.m);
    if(!m){
      m=L.marker(p.ll,{icon:ic.make(),keyboard:false,zIndexOffset:isSel?1000:fav?500:0}).addTo(map);
      m.on('click',()=>onMarker(s.m));m._k=ic.key;markers.set(s.m,m);
    }else{
      m.setLatLng(p.ll);
      if(m._k!==ic.key){m.setIcon(ic.make());m._k=ic.key;m.setZIndexOffset(isSel?1000:fav?500:0);}
    }
  }
  for(const[id,m]of markers)if(!seen.has(id)){map.removeLayer(m);markers.delete(id);}
  if(state.note&&Date.now()<state.note.until)setStatus(state.note.text,state.note.err);
  else if(gated&&!state.err)setStatus('Schiffe erscheinen ab Zoom '+MIN_ZOOM+' (ca. 20 km Umkreis). Bitte näher heranzoomen.',false);
  else if(state.err)setStatus(state.err,true);
  else{const st=statusLine(lastShown);if(st)setStatus(st[0],st[1]);}
  if(sel&&sel.follow){
    const m=markers.get(sel.m);
    if(m){const a=map.latLngToContainerPoint(m.getLatLng()),c=map.getSize().divideBy(2);if(a.distanceTo(c)>3)map.panTo(m.getLatLng(),{animate:true,duration:.8});}
  }

  if(state.sheet==='ship')renderShipStatus();

}

/* ---------- Schiff verfolgen ---------- */
function onMarker(m){
  if(state.sel&&state.sel.m===m){if(state.sheet!=='ship')openSheet('ship');return;}
  selectShip(m,false);
}
function selectShip(m,fly){
  const s=state.ships.get(m);if(!s)return;
  clearRoute();
  state.sel={m,follow:true,dest:undefined,showData:false};
  for(const mk of markers.values())mk._k='';
  setTab('map',true);openSheet('ship');
  const p=shipPos(s,nowSec());
  if(fly||!map.getBounds().contains(p.ll))map.setView(p.ll,Math.max(map.getZoom(),13));
  buildRoute();render();resolveDest(state.sel);resolveOrigin(state.sel);
}
function clearSel(){state.sel=null;clearRoute();for(const m of markers.values())m._k='';render();}
function clearRoute(){if(route){map.removeLayer(route.group);route=null;}}
/* Navi-Ansicht: Kielwasser grau, Kurs der nächsten 30 Minuten kräftig, Ziel laut AIS gestrichelt */
function buildRoute(){
  const sel=state.sel,s=sel&&state.ships.get(sel.m);if(!s)return;
  const c=cssVar('--'+s.cat)||'#888',fill=cssVar('--surface')||'#fff',grey=cssVar('--muted')||'#888';
  const wake=L.polyline([],{color:grey,weight:4,opacity:.55,dashArray:'2 7',lineCap:'round',interactive:false});
  const casing=L.polyline([],{color:fill,weight:10,opacity:.9,lineCap:'round',interactive:false});
  const ahead=L.polyline([],{color:c,weight:6,lineCap:'round',interactive:false});
  const dest=L.polyline([],{color:c,weight:2,opacity:.8,dashArray:'6 8',interactive:false});
  const group=L.layerGroup([wake,dest,casing,ahead]).addTo(map);
  route={group,wake,casing,ahead,dest,cat:s.cat,labels:new Map()};
}
function routeGeometry(s,now){
  const p=shipPos(s,now),pts=[];
  const tr=s.tr||[];
  for(let i=0;i+2<tr.length;i+=3)if(tr[i+2]<=s.ts+1)pts.push([tr[i],tr[i+1]]);
  const wake=pts.concat([[s.lat,s.lon],p.ll]);
  const c=courseOf(s),still=isStill(s)||c==null;
  let ahead=[],river=false;
  if(!still){
    const sn=snapShip(s);
    if(sn){
      const v=s.sog*KN,m0=v*Math.min(p.age,EXTRAP_RIVER),w=walkNet(sn,m0+v*AHEAD_RIVER);
      ahead=polyFrom(w,m0);river=ahead.length>1;
    }
    if(!river)ahead=[p.ll,project(p.ll,c,Math.max(150,s.sog*KN*AHEAD))];
  }
  return{p,wake,ahead,river};
}
function setLabel(key,ll,txt,dest){
  let tt=route.labels.get(key);
  if(!ll){if(tt){route.group.removeLayer(tt);route.labels.delete(key);}return;}
  if(!tt){
    tt=L.tooltip({permanent:true,direction:'auto',offset:[10,0],className:'rlab'+(dest?' dest':'')+' c-'+route.cat,interactive:false}).setLatLng(ll).setContent(txt);
    route.group.addLayer(tt);route.labels.set(key,tt);tt._txt=txt;
  }else{tt.setLatLng(ll);if(tt._txt!==txt){tt.setContent(txt);tt._txt=txt;}}
}
function paintRoute(){
  const sel=state.sel;if(!route||!sel)return;
  const s=state.ships.get(sel.m);if(!s)return;
  const g=routeGeometry(s,nowSec());
  route.wake.setLatLngs(g.wake.length>2?g.wake:[]);
  route.ahead.setLatLngs(g.ahead);route.casing.setLatLngs(g.ahead);
  setLabel('ahead',g.ahead.length?g.ahead[g.ahead.length-1]:null,g.river?'in 30 min':'Kurs',false);
  const d=sel.dest;
  if(d&&d.ll&&dist(g.p.ll,d.ll)>500){
    planRoute(sel);
    const rt=sel.rt&&sel.rt.pts?sel.rt:null,v=s.sog*KN;
    let txt='Ziel '+d.name;
    if(rt){   // ganze Strecke auf dem Wasser, die ersten 30 Minuten kräftig
      const m0=Math.min(rt.len,v*Math.min(g.p.age,EXTRAP_RIVER)),rem=Math.max(0,rt.len-m0);
      const line=polyFrom(rt,m0);if(dist(line[line.length-1],d.ll)>30)line.push(d.ll);
      route.dest.setStyle({weight:3,opacity:.75,dashArray:null});route.dest.setLatLngs(line);
      const a2=polySlice(rt,m0,m0+v*AHEAD_RIVER);
      route.ahead.setLatLngs(a2);route.casing.setLatLngs(a2);
      setLabel('ahead',a2[a2.length-1],'in 30 min',false);
      const et=etaTime(s.eta,Date.now());
      txt+=' · '+(rem>=10000?Math.round(rem/1000):(rem/1000).toFixed(1).replace('.',','))+' km';
      if(et&&et>Date.now()-864e5)txt+=' · '+fmtEta(et);
      else if(v>.5)txt+=' · ca. '+fmtEta(Date.now()+rem/v*1000);
    }else{
      route.dest.setStyle({weight:2,opacity:.8,dashArray:'6 8'});route.dest.setLatLngs([g.p.ll,d.ll]);
      const et=etaTime(s.eta,Date.now());
      txt+=' · Luftlinie'+(et&&et>Date.now()-864e5?' · '+fmtEta(et):'');
    }
    setLabel('dest',d.ll,txt,true);
  }else{route.dest.setLatLngs([]);setLabel('dest',null);}
  const og=sel.orig;
  if(og&&og.ll)setLabel('start',og.ll,'Start'+(og.name?' '+og.name:''),false);else setLabel('start',null);

/* Gesamtstrecke zum Ziel planen: Gewässernetz zwischen Schiff und Ziel laden, kürzesten Weg suchen.
   Neu geplant wird bei jeder neuen Meldung des Schiffs. */
let RN=null,RNbox=null,RNtried=false;
async function loadRouteNet(a,b){
  const S=Math.min(a[0],b[0])-.2,N=Math.max(a[0],b[0])+.2,W=Math.min(a[1],b[1])-.3,E=Math.max(a[1],b[1])+.3;
  const area=(N-S)*(E-W)*Math.cos((S+N)*Math.PI/360);
  if(area>40)return null;
  if(!RN&&!RNtried){RNtried=true;const c=await kv.get('route');if(c&&c.els&&Date.now()-c.at<7*864e5){RN=buildNet(c.els);RNbox=c.box;}}
  if(RN&&RNbox&&RNbox[0]<=S&&RNbox[1]<=W&&RNbox[2]>=N&&RNbox[3]>=E)return RN;
  const filt=area>3?'["cemt"~"^(III|IV|Va|Vb|VIa|VIb|VIc|VII|[3-7])"]':'';   // große Gebiete: nur Wasserstraßen mit Klasseneinstufung
  const q='[out:json][timeout:60];way["waterway"~"^(river|canal)$"]'+filt+'('+[S,W,N,E].map(x=>x.toFixed(4)).join(',')+');out geom;';
  const r=await overpass(q);
  if(!r.ok)throw new Error(r.status);
  const els=(await r.json()).elements||[];
  RN=buildNet(els);RNbox=[S,W,N,E];kv.set('route',{at:Date.now(),box:RNbox,els:slim(els)});return RN;
}
async function planRoute(sel){
  const s=state.ships.get(sel.m),d=sel.dest;
  if(!s||!d||!d.ll||sel.rtBusy||isStill(s)||courseOf(s)==null)return;
  const rt=sel.rt;
  if(rt&&rt.ts===s.ts&&!(rt.err&&Date.now()-rt.at>120000))return;
  sel.rtBusy=true;
  let res={ts:s.ts,at:Date.now(),fail:true};
  try{
    const net=await loadRouteNet([s.lat,s.lon],d.ll);
    if(net&&net.edges.length){
      const sn=snapIn(net,s),dp=nearEdge(net,d.ll,10000);
      const w=sn&&dp?routeNet(net,sn,dp):null;
      if(w&&w.len>0)res={ts:s.ts,at:Date.now(),pts:w.pts,cum:w.cum,len:w.len};
    }
  }catch(e){res.err=true;}
  sel.rtBusy=false;
  if(state.sel!==sel)return;
  sel.rt=res;paintRoute();
}

}

/* Ziel laut AIS in einen Ort auflösen: zuerst UN/LOCODE-Tabelle, sonst OpenStreetMap-Suche (Nominatim, gecacht) */
const destCache=store.get('dest',{});
async function resolveDest(sel){
  const s=state.ships.get(sel.m);if(!s||!s.d){sel.dest=null;return;}
  const q=destQuery(s.d);
  if(!q){sel.dest=null;return;}
  if(q.ll){sel.dest=q;paintRoute();renderShipSheet();return;}
  const key=q.text;
  if(!(key in destCache)){
    try{
      const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&featureType=settlement&q='+encodeURIComponent(key);
      const r=await fetch(u,{headers:{accept:'application/json'}});
      const j=r.ok?await r.json():[];
      destCache[key]=j[0]?[j[0].name||key,+j[0].lat,+j[0].lon]:null;
      store.set('dest',destCache);
    }catch(e){return;}
  }
  if(state.sel!==sel)return;
  const hit=destCache[key];
  sel.dest=hit&&dist([s.lat,s.lon],[hit[1],hit[2]])<2000000?{name:hit[0],ll:[hit[1],hit[2]]}:null;
  paintRoute();renderShipSheet();
}

function computePass(){
  const now=nowSec(),pl=[state.place.lat,state.place.lon],come=[],near=[];
  for(const s of state.ships.values()){
    if(!state.cats.has(s.cat)||!matches(s,state.query))continue;
    const p=shipPos(s,now),ps=passage(s,p,pl,now);
    if(ps.d>RADIUS)continue;
    if(ps.still){if(ps.d<2500)near.push({s,p,ps});continue;}
    if(ps.d<400)come.push({s,p,ps,eta:now,here:true});
    else if(ps.toward&&ps.eta&&ps.eta-now<5400)come.push({s,p,ps,eta:ps.eta});
  }
  come.sort((a,b)=>a.eta-b.eta);near.sort((a,b)=>a.ps.d-b.ps.d);
  state.placeShips=new Set(come.concat(near).map(x=>x.s.m));
  return{come,near:near.slice(0,15)};
}

let pegel=null;
async function loadPegel(){
  const pl=state.place;if(!pl)return;
  const key=pl.lat.toFixed(3)+','+pl.lon.toFixed(3);
  if(!pegel||pegel.key!==key||Date.now()-pegel.at>300000){
    try{
      const u='https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations.json?latitude='+pl.lat.toFixed(4)+'&longitude='+pl.lon.toFixed(4)+
        '&radius=25&includeTimeseries=true&includeCurrentMeasurement=true&timeseries=W';
      const r=await fetch(u);if(!r.ok)throw new Error(r.status);
      const list=(await r.json()).filter(x=>x.latitude!=null&&(x.timeseries||[]).some(t=>t.shortname==='W'&&t.currentMeasurement));
      list.sort((a,b)=>dist([a.latitude,a.longitude],[pl.lat,pl.lon])-dist([b.latitude,b.longitude],[pl.lat,pl.lon]));
      pegel={key,at:Date.now(),st:list[0]||null};
    }catch(e){pegel={key,at:Date.now()-240000,st:null};}
  }
  paintPegel();

/* ---------- Häfen (OpenStreetMap), Hafenblatt mit Schiffen im Hafen, Pegel und Wikipedia ---------- */
const PORT_ZOOM=11,PORT_LABEL_ZOOM=13,PORT_TTL=7*864e5;
const PORT_KIND={hafen:'Hafen',becken:'Hafenbecken',marina:'Sportboothafen',faehre:'Fähranleger'};
const CARGO={general:'Stückgut',container:'Container',liquid_bulk:'Flüssiggut',dry_bulk:'Schüttgut',passengers:'Passagiere',vehicles:'Fahrzeuge',oil:'Öl',chemical:'Chemie',bulk:'Schüttgut',cargo:'Güter',roro:'Roll-on/Roll-off',fishing:'Fischerei'};
const portLayer=L.layerGroup().addTo(map);
let portData=[],portBox=null,portAt=0,portBusy=false,portSel=null;
const portFilter=b=>'(nwr["harbour"="yes"]'+b+';nwr["landuse"="harbour"]'+b+';nwr["industrial"="port"]'+b+';nwr["landuse"="port"]'+b+';nwr["seamark:type"="harbour"]'+b+';nwr["leisure"="marina"]'+b+';nwr["amenity"="ferry_terminal"]'+b+';nwr["waterway"="dock"]["name"]'+b+';)';
function portKindOf(t){return t.industrial==='port'||t.landuse==='port'||t.landuse==='harbour'||t['seamark:type']==='harbour'||t.harbour==='yes'&&!t.leisure&&!t.amenity&&!t.waterway?'hafen':t.waterway==='dock'?'becken':t.leisure==='marina'?'marina':t.amenity==='ferry_terminal'?'faehre':'hafen';}
const KIND_RANK={hafen:0,becken:1,marina:2,faehre:3};
/* Overpass-Antwort -> benannte Häfen; mehrere Einträge desselben Namens in der Nähe werden zusammengefasst */
function parsePorts(els){
  const out=[];
  for(const e of els){
    const t=e.tags||{},name=t.name||t['seamark:name'];if(!name)continue;
    const bb=e.bounds?[e.bounds.minlat,e.bounds.minlon,e.bounds.maxlat,e.bounds.maxlon]:e.lat!=null?[e.lat,e.lon,e.lat,e.lon]:null;if(!bb)continue;
    const it={id:e.type[0]+e.id,name,kind:portKindOf(t),bb,lat:(bb[0]+bb[2])/2,lon:(bb[1]+bb[3])/2,t};
    const dup=out.find(o=>norm(o.name)===norm(name)&&dist([o.lat,o.lon],[it.lat,it.lon])<2500);
    if(dup){
      dup.t={...it.t,...dup.t};
      dup.bb=[Math.min(dup.bb[0],bb[0]),Math.min(dup.bb[1],bb[1]),Math.max(dup.bb[2],bb[2]),Math.max(dup.bb[3],bb[3])];
      dup.lat=(dup.bb[0]+dup.bb[2])/2;dup.lon=(dup.bb[1]+dup.bb[3])/2;
      if(KIND_RANK[it.kind]<KIND_RANK[dup.kind])dup.kind=it.kind;
    }else out.push(it);
  }
  return out;
}
async function loadPorts(){
  if(!state.ports||map.getZoom()<PORT_ZOOM||document.hidden||portBusy)return;
  if(portBox&&portBox.contains(map.getBounds())&&Date.now()-portAt<PORT_TTL)return;
  const b=map.getBounds().pad(.4);portBusy=true;
  try{
    const bb='('+[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(x=>x.toFixed(5)).join(',')+')';
    const r=await overpass('[out:json][timeout:25];'+portFilter(bb)+';out tags bb 1500;');
    portData=parsePorts((await r.json()).elements||[]);portBox=b;portAt=Date.now();
    kv.set('ports',{at:portAt,box:[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()],data:portData});
  }catch(e){portAt=Date.now()-PORT_TTL+300000;}finally{portBusy=false;}
  paintPorts();
}
function paintPorts(){
  portLayer.clearLayers();
  if(!state.ports||map.getZoom()<PORT_ZOOM)return;
  const b=map.getBounds().pad(.1),z=map.getZoom(),lab=z>=PORT_LABEL_ZOOM;
  for(const h of portData){
    if(!b.contains([h.lat,h.lon]))continue;
    if(!lab&&h.kind!=='hafen')continue;
    const span=el('span',lab?'':'dot');span.appendChild(el('b',null,h.name));
    const m=L.marker([h.lat,h.lon],{icon:L.divIcon({className:'',html:'<span class="hfm">'+span.outerHTML+'</span>',iconSize:[0,0]}),keyboard:false,zIndexOffset:-400});
    m.on('click',()=>{pickPort(h);});
    portLayer.addLayer(m);
  }
}

function pickPort(h,fit){
  portSel=h;
  if(state.sel&&state.sel.follow){state.sel.follow=false;const fb=$('followBtn');if(fb)fb.setAttribute('aria-pressed','false');}
  openSheet('port');

}
function shipsInPort(h){
  const pad=.0015,out=[];
  for(const s of state.ships.values()){
    if(s.lat>=h.bb[0]-pad&&s.lat<=h.bb[2]+pad&&s.lon>=h.bb[1]-pad&&s.lon<=h.bb[3]+pad)out.push(s);
  }
  return out;
}
function portOfShip(s){
  let best=null;
  for(const h of portData){
    if(s.lat<h.bb[0]-.0012||s.lat>h.bb[2]+.0012||s.lon<h.bb[1]-.0012||s.lon>h.bb[3]+.0012)continue;
    const a=(h.bb[2]-h.bb[0])*(h.bb[3]-h.bb[1]);
    if(!best||a<best.a)best={h,a};   // kleinste Fläche = genauester Eintrag (Becken vor Gesamthafen)
  }
  return best?best.h:null;
}
const wikiCache=store.get('wiki',{});
async function wikiFor(t){
  let lang='de',title=null;
  const wp=t.wikipedia;
  if(wp&&/^[a-z-]+:/.test(wp)){lang=wp.split(':')[0];title=wp.slice(lang.length+1);}
  else if(t.wikidata){
    const k='wd:'+t.wikidata;
    if(!(k in wikiCache)){
      try{
        const r=await fetch('https://www.wikidata.org/w/api.php?action=wbgetentities&props=sitelinks&sitefilter=dewiki|enwiki&format=json&origin=*&ids='+encodeURIComponent(t.wikidata));
        const e=((await r.json()).entities||{})[t.wikidata]||{},sl=e.sitelinks||{};
        wikiCache[k]=sl.dewiki?'de:'+sl.dewiki.title:sl.enwiki?'en:'+sl.enwiki.title:null;
      }catch(e){return undefined;}
    }
    const v=wikiCache[k];if(!v)return null;lang=v.split(':')[0];title=v.slice(lang.length+1);
  }
  if(!title)return null;
  const key=lang+':'+title;
  if(!(key in wikiCache)){
    try{
      const r=await fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_')));
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();
      wikiCache[key]=j.extract?{x:j.extract.slice(0,700),d:j.description||'',u:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||''}:null;
    }catch(e){return undefined;}
  }
  store.set('wiki',wikiCache);
  return wikiCache[key];
}

/* Hafen am Start oder Ziel eines Schiffs öffnen (aus dem Zwischenspeicher, sonst kurze Abfrage im Umkreis) */
async function openPortAt(ll){
  const near=()=>{let b=null,bd=6000;for(const h of portData){const d=dist(ll,[h.lat,h.lon]);if(d<bd){bd=d;b=h;}}return b;};
  let h=near();

    try{

      const r=await overpass('[out:json][timeout:20];'+portFilter('(around:6000,'+c+')')+';out tags bb 200;');

  if(h.kind==='lock'){const e=el('a',null,'ELWIS Schleuseninformationen ↗');e.href='https://www.elwis.de';e.target='_blank';e.rel='noopener';links.appendChild(e);}
  body.appendChild(links);
  if(h.kind==='lock')body.appendChild(el('p','hint','Amtliche Betriebszeiten und aktuelle Sperrungen der Bundesschleusen stehen bei ELWIS (Menü „Schleuseninformationen“), nicht in dieser Karte.'));
  if(!tel.length&&!web&&!mail)body.appendChild(el('p','hint','Telefon und Website sind in OpenStreetMap für diesen Eintrag nicht hinterlegt.'));
}

/* ---------- Pegel auf der Karte (PEGELONLINE, WSV) ---------- */
const PEGEL_ZOOM=10;
const gauges=new Map(),gaugeLayer=L.layerGroup().addTo(map);
let gaugeLast=null,gaugeBusy=false,gaugeSel=null;
const TREND={'1':'steigend','0':'gleichbleibend','-1':'fallend'},TREND_ARROW={'1':'↗','0':'→','-1':'↘'};
async function loadGauges(){
  if(!state.pegel||map.getZoom()<PEGEL_ZOOM||document.hidden||gaugeBusy)return;
  const b=map.getBounds(),c=map.getCenter(),rv=dist([b.getSouth(),b.getWest()],[b.getNorth(),b.getEast()])/2000;
  if(gaugeLast&&Date.now()-gaugeLast.at<300000&&dist([c.lat,c.lng],gaugeLast.c)/1000+rv<=gaugeLast.r){paintGauges();return;}
  const r=Math.min(100,Math.ceil(rv*1.4));
  gaugeBusy=true;
  try{
    const u='https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations.json?latitude='+c.lat.toFixed(4)+'&longitude='+c.lng.toFixed(4)+
      '&radius='+r+'&includeTimeseries=true&includeCurrentMeasurement=true&timeseries=W';
    const res=await fetch(u);if(!res.ok)throw new Error(res.status);
    for(const st of await res.json()){
      const ts=(st.timeseries||[]).find(t=>t.shortname==='W'&&t.currentMeasurement);
      if(!ts||st.latitude==null)continue;
      const m=ts.currentMeasurement;
      gauges.set(st.number,{number:st.number,name:title(st.longname),water:st.water?title(st.water.longname):'',km:st.km,lat:st.latitude,lon:st.longitude,
        value:m.value,unit:ts.unit||'cm',trend:m.trend,ts:Date.parse(m.timestamp),nsw:m.stateNswHsw,mnw:m.stateMnwMhw});
    }
    gaugeLast={c:[c.lat,c.lng],r,at:Date.now()};store.set('gauges',[...gauges.values()]);
  }catch(e){}finally{gaugeBusy=false;}
  paintGauges();
}
function paintGauges(){
  gaugeLayer.clearLayers();
  if(!state.pegel||map.getZoom()<PEGEL_ZOOM)return;
  const b=map.getBounds().pad(.1),big=map.getZoom()>=12;
  for(const g of gauges.values()){
    if(!b.contains([g.lat,g.lon]))continue;
    const span=el('span',big?'':'dot');
    if(big)span.textContent=Math.round(g.value);
    const m=L.marker([g.lat,g.lon],{icon:L.divIcon({className:'',html:'<span class="pgm">'+span.outerHTML+'</span>',iconSize:[0,0]}),keyboard:false,zIndexOffset:-500});
    m.on('click',()=>{gaugeSel=g;openSheet('gauge');});
    gaugeLayer.addLayer(m);
  }
  paintAttrib();
}
const NSW={low:'unter Niedrigwasser',high:'über Hochwasser',normal:'normal'};
function renderGauge(){
  const g=gaugeSel;if(!g)return;
  $('shTitle').replaceChildren(el('span',null,'Pegel '),g.name);
  const body=$('shBody');body.replaceChildren();
  const row=el('div','nowrow'),now=el('div','now',g.water?g.water+(g.km!=null?', km '+nf(g.km,1):''):'');
  now.appendChild(el('small','num',(TREND[String(g.trend)]?TREND_ARROW[String(g.trend)]+' '+TREND[String(g.trend)]+' · ':'')+'Stand '+hhmm(g.ts)));
  const sp=el('div','speed num',nf(g.value,0));sp.appendChild(el('small',null,g.unit+' Pegelstand'));
  row.append(now,sp);body.appendChild(row);
  const dl=el('dl','facts');
  if(NSW[g.nsw]&&g.nsw!=='normal')dl.append(el('dt',null,'Lage'),el('dd',null,NSW[g.nsw]));
  dl.append(el('dt',null,'Nummer'),el('dd',null,String(g.number)));
  if(dl.children.length)body.appendChild(dl);
  const acts=el('div','acts');
  const mk=el('button','btn pri','Als Mein Ort');mk.type='button';
  mk.onclick=()=>{setPlace({name:g.name,lat:+g.lat.toFixed(5),lon:+g.lon.toFixed(5)});openSheet('pass');};
  const a=el('a','btn','Pegelonline ↗');a.href='https://www.pegelonline.wsv.de/gast/stammdaten?pegelnr='+encodeURIComponent(g.number);a.target='_blank';a.rel='noopener';a.style.textDecoration='none';a.style.color='inherit';
  acts.append(mk,a);body.appendChild(acts);
}

/* ---------- Suche ---------- */
function findShip(){
  const q=state.query;if(!q)return;
  const hits=[...state.ships.values()].filter(s=>matches(s,q)).sort((a,b)=>(isStill(a)?1:0)-(isStill(b)?1:0)||a.name.localeCompare(b.name));
  if(!hits.length){note('Kein Schiff „'+state.queryRaw+'“ im geladenen Ausschnitt.',true,8000);return;}
  if(hits.length===1){selectShip(hits[0].m,true);return;}
  state.found=hits.slice(0,40);setTab('map',true);openSheet('find');
}
function renderFind(){
  $('shTitle').textContent=state.found.length+' Treffer für „'+state.queryRaw+'“';
  const body=$('shBody');body.replaceChildren();
  const ul=el('ul','rows'),now=nowSec();
  for(const s of state.found){
    const li=el('li'),b=el('button','row');b.type='button';b.style.gridTemplateColumns='auto minmax(0,1fr)';
    const d=el('span','d',typeLabel(s.t));d.appendChild(el('small',null,(isStill(s)?'liegt':'unterwegs'+(s.d?' nach '+destLabel(s.d):''))+' · Meldung '+ago(now-s.ts)));
    b.append(el('span','badge c-'+s.cat,s.name),d);
    b.onclick=()=>selectShip(s.m,true);li.appendChild(b);ul.appendChild(li);
  }
  body.appendChild(ul);
}

/* ---------- Was ist neu (liest CHANGELOG.md aus dem Repo) ---------- */
let news=null;
async function loadNews(){
  try{
    const r=await fetch('CHANGELOG.md',{cache:'no-cache'});if(!r.ok)return;
    news=parseChangelog(await r.text());if(!news.length)return;
    const seen=store.get('news',null),latest=news[0].v;
    if(seen==null&&!['place','favs','cats'].some(k=>store.get(k,null)!=null)){store.set('news',latest);return;}
    if(seen===latest)return;
    const fresh=seen==null?news.slice(0,1):news.filter(e=>e.v>seen);
    const first=(fresh[0]||news[0]).items[0],n=fresh.reduce((a,e)=>a+e.items.length,0);
    $('newsOpen').replaceChildren(el('b',null,'Neu: '),first+(n>1?' (+'+(n-1)+')':''));
    $('news').hidden=false;
  }catch(e){}
}
function markNewsSeen(){if(news&&news.length)store.set('news',news[0].v);$('news').hidden=true;}
function renderNews(){
  $('shTitle').textContent='Was ist neu';
  const body=$('shBody');body.replaceChildren();
  if(!news||!news.length){body.appendChild(el('p','hint','Die Liste der Neuerungen lässt sich gerade nicht laden.'));return;}
  const box=el('div','newsbox');
  for(const e of news){
    const d=/^\d{4}-\d{2}-\d{2}$/.test(e.v)?new Date(e.v+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}):e.v;
    box.appendChild(el('h3',null,d));
    const ul=el('ul');for(const it of e.items)ul.appendChild(el('li',null,it));box.appendChild(ul);
  }
  body.appendChild(box);markNewsSeen();
}
function newsLink(){const b=el('button','newslink','Was ist neu?');b.type='button';b.onclick=async()=>{if(!news)await loadNews();openSheet('news');};return b;}
function footLinks(){const d=el('div');d.style.cssText='display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px;align-self:flex-start';const n=newsLink(),a=aboutLink();n.style.margin='0';d.append(n,a);return d;}
function aboutLink(){const b=el('button','newslink','Über Schiffsradar');b.type='button';b.style.marginTop='0';b.onclick=()=>openSheet('about');return b;}
function renderAbout(){
  $('shTitle').textContent='Über Schiffsradar';
  const body=$('shBody');body.replaceChildren();

  const box=el('div','newsbox');

  li(el('b',null,'Grundkarte: '),'© Esri und © ',a('OpenStreetMap-Mitwirkende','https://www.openstreetmap.org/copyright'),' (ODbL).');

  li(el('b',null,'Schifffahrtszeichen: '),'© ',a('OpenSeaMap','https://www.openseamap.org'),'.');
  li(el('b',null,'Vereine und Schleusen: '),'© ',a('OpenStreetMap-Mitwirkende','https://www.openstreetmap.org/copyright'),' (ODbL), von Freiwilligen gepflegt. Angaben können fehlen oder veraltet sein.');
  li(el('b',null,'Häfen: '),'© ',a('OpenStreetMap-Mitwirkende','https://www.openstreetmap.org/copyright'),' (ODbL); Beschreibungen aus ',a('Wikipedia','https://de.wikipedia.org'),' (CC BY-SA), soweit der Hafen dort verknüpft ist.');

  box.appendChild(ul);

  const p=el('p');p.append('Quelltext und Lizenz (MIT): ',a('github.com/SquaredP/schiffsradar','https://github.com/SquaredP/schiffsradar'),'. Positionen sind Schätzungen und ersetzen keine Navigation.');
  box.appendChild(p);

$('newsOpen').onclick=()=>openSheet('news');
$('newsX').onclick=markNewsSeen;

/* ---------- Blatt und Reiter ---------- */
/* Stufen des Blattes auf dem Handy: kompakt, halb, voll. Beim Öffnen kompakt, nur das Blatt des verfolgten Fahrzeugs halb. */
const SNAPS=['peek','half','full'];
function setSnap(sn){$('sheet').dataset.snap=sn;map.invalidateSize();setTimeout(()=>map.invalidateSize(),260);}
(()=>{
  const g=$('shGrab');let y0=null,moved=false;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;try{g.setPointerCapture(e.pointerId)}catch(_){}});
  g.addEventListener('pointermove',e=>{if(y0!=null&&Math.abs(e.clientY-y0)>8)moved=true;});
  g.addEventListener('pointerup',e=>{
    if(y0==null)return;const dy=y0-e.clientY;y0=null;
    const i=SNAPS.indexOf($('sheet').dataset.snap);
    if(!moved)setSnap(SNAPS[(i+1)%3]);
    else setSnap(SNAPS[Math.max(0,Math.min(2,i+(dy>0?1:-1)))]);
  });
  g.addEventListener('pointercancel',()=>{y0=null;});
})();
function openSheet(kind){
  if(state.sheet!==kind)$('sheet').dataset.snap=kind==='ship'?'half':'peek';
  closeMenu();
  state.sheet=kind;$('sheet').hidden=false;$('shBadge').hidden=true;
  if(kind==='ship')renderShipSheet();
  if(kind==='pass')renderPass();
  if(kind==='place')renderPlacePicker();
  if(kind==='fav')renderFavs();
  if(kind==='find')renderFind();
  if(kind==='news')renderNews();
  if(kind==='about')renderAbout();
    if(kind==='port')renderPort();
  if(kind==='poi')renderPoi();
  if(kind==='gauge')renderGauge();
  map.invalidateSize();paintTrack();
}
/* Schließen klappt nur das Blatt ein. Das Schiff bleibt verfolgt, bis die Kapsel oben mit × beendet wird. */
function closeSheet(){state.sheet=null;$('sheet').hidden=true;setTab('map',true);map.invalidateSize();paintTrack();}
function setTab(tab,quiet){
  state.tab=tab;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===tab)));
  if(quiet)return;
  if(tab==='pass')openSheet(state.place?'pass':'place');
  else if(tab==='fav')openSheet('fav');
  else if(tab==='map'&&state.sheet&&state.sheet!=='ship'){state.sheet=null;$('sheet').hidden=true;if(state.sel)openSheet('ship');map.invalidateSize();}
}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab);});
$('shClose').onclick=closeSheet;
$('placeBtn').onclick=()=>{setTab('pass',true);openSheet('place');};
$('placeClear').onclick=()=>{setPlace(null);if(state.sheet==='pass'||state.sheet==='place')openSheet('place');};

/* ---------- Filter ---------- */
function paintChips(){
  const n=state.cats.size,k=CAT_ORDER.length;
  $('typeTxt').textContent=(n===k?'Alle Typen':n?n+' von '+k+' Typen':'Keine Typen')+(state.still?' + liegende':'');
  $('seaChip').setAttribute('aria-pressed',String(state.sea));
  $('pegelChip').setAttribute('aria-pressed',String(state.pegel));
  $('portChip').setAttribute('aria-pressed',String(state.ports));
  $('clubChip').setAttribute('aria-pressed',String(state.clubs));
  $('lockChip').setAttribute('aria-pressed',String(state.locks));
}
/* Aufklappmenüs: „Typen“ (welche Schiffe) und „Namen“ (bei welchen Typen das Namensschild steht) */
let menuKind=null;
function closeMenu(){menuKind=null;$('menu').hidden=true;$('typeBtn').setAttribute('aria-expanded','false');}
function renderMenu(){
  const box=$('menu'),isType=true,keys=CAT_ORDER;
  box.replaceChildren(el('h3',null,isType?'Diese Schiffstypen zeigen':'Diese Zeichen zeigen'));
  const all=el('div','all'),a1=el('button',null,'Alle'),a2=el('button',null,'Keine');a1.type=a2.type='button';
  const save=()=>store.set('cats',[...state.cats]);
  const setAll=on=>{
    state.cats=new Set(on?CAT_ORDER:[]);
    save();paintChips();renderMenu();render();paintPass(true);
  };
  a1.onclick=()=>setAll(true);a2.onclick=()=>setAll(false);all.append(a1,a2);box.appendChild(all);
  for(const k of keys){
    const lab=el('label',isType?'c-'+k:''),cb=el('input'),dot=el('i');cb.type='checkbox';
    cb.checked=state.cats.has(k);
    cb.onchange=()=>{
      cb.checked?state.cats.add(k):state.cats.delete(k);
      save();paintChips();render();paintPass(true);
    };
    lab.append(cb,dot,el('span',null,CATS[k]));box.appendChild(lab);
  }
  if(isType){
    const lab=el('label'),cb=el('input'),dot=el('i','ring');cb.type='checkbox';cb.checked=state.still;
    cb.onchange=()=>{state.still=cb.checked;store.set('still',state.still);paintChips();render();paintPass(true);};
    lab.append(cb,dot,el('span',null,'Liegende (festgemacht, vor Anker)'));
    box.append(el('h3',null,'Zusätzlich'),lab);
  }
}
function openMenu(kind){
  if(menuKind===kind){closeMenu();return;}
  if(state.sheet)closeSheet();
  menuKind=kind;renderMenu();$('menu').hidden=false;
  $('typeBtn').setAttribute('aria-expanded',String(kind==='type'));
}
/* composedPath statt closest: „Alle/Keine“ baut das Menü neu, das angeklickte Element ist dann schon abgehängt */
document.addEventListener('click',e=>{if(menuKind&&!e.composedPath().some(n=>n.id==='menu'||n.id==='typeBtn'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  if(c.id==='typeBtn')return openMenu('type');
  if(c.id==='seaChip'){state.sea=!state.sea;store.set('sea',state.sea);applySea();}
  if(c.id==='clubChip'){state.clubs=!state.clubs;store.set('clubs',state.clubs);paintPois();}
  if(c.id==='lockChip'){state.locks=!state.locks;store.set('locks',state.locks);paintPois();}
  if(c.id==='portChip'){state.ports=!state.ports;store.set('ports',state.ports);if(state.ports)loadPorts();paintPorts();}
  if(c.id==='pegelChip'){state.pegel=!state.pegel;store.set('pegel',state.pegel);if(state.pegel)loadGauges();paintGauges();}
  paintChips();render();paintPass(true);
});
$('shipQ').addEventListener('input',e=>{state.queryRaw=e.target.value.trim();state.query=norm(e.target.value);render();paintPass(true);});
$('shipQ').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();findShip();}});

/* ---------- Standort ---------- */
function locate(cb){
  if(!navigator.geolocation){setStatus('Dieser Browser gibt keinen Standort frei.',true);return;}
  navigator.geolocation.getCurrentPosition(p=>cb([p.coords.latitude,p.coords.longitude]),
    ()=>setStatus('Standort nicht verfügbar. Freigabe im Browser prüfen (nur über https).',true),{enableHighAccuracy:true,timeout:10000});
}
$('locBtn').onclick=()=>locate(ll=>{
  if(meMarker)meMarker.setLatLng(ll);else meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<span class="me"></span>',iconSize:[0,0]}),interactive:false}).addTo(map);
  if(state.sel)state.sel.follow=false;
  map.setView(ll,Math.max(map.getZoom(),13));
});

/* ---------- Takt ---------- */
let moveT=null;
/* Beim Folgen verschiebt render() selbst die Karte; dann nicht erneut rendern, sonst entsteht eine Schleife */
/* Doppeltippen = eine Zoomstufe näher, um die Tippstelle (eigene Erkennung, weil iOS-Safari das sonst als Seitenzoom schluckt) */
{const c=map.getContainer();let last=null;
  c.style.touchAction='none';
  c.addEventListener('pointerup',e=>{
    if(e.pointerType==='mouse'||e.target.closest('.leaflet-control,.leaflet-popup'))return;
    const t=Date.now(),p=[e.clientX,e.clientY];
    if(last&&t-last.t<320&&Math.hypot(p[0]-last.p[0],p[1]-last.p[1])<30){
      last=null;e.preventDefault();
      map.setZoomAround(map.mouseEventToContainerPoint(e),Math.min(map.getMaxZoom()||19,map.getZoom()+1));
    }else last={t,p};
  });
  map.on('dblclick',e=>map.setZoomAround(e.containerPoint,Math.min(map.getMaxZoom()||19,map.getZoom()+1)));}
map.on('zoomend',()=>{paintGauges();paintPorts();paintPois();});
map.on('moveend',()=>{const c=map.getCenter();store.set('view',{c:[c.lat,c.lng],z:map.getZoom()});if(!(state.sel&&state.sel.follow))render();clearTimeout(moveT);moveT=setTimeout(()=>{if(state.src==='live')loadData();loadGauges();loadWays();loadPorts();loadPois();},900);});
map.on('dragstart',()=>{if(state.sel&&state.sel.follow){state.sel.follow=false;const b=$('followBtn');if(b)b.setAttribute('aria-pressed','false');}});
setInterval(()=>{if(!document.hidden){render();paintPass();}},1000);
setInterval(()=>{loadData();loadGauges();loadWays();loadPorts();loadPois();},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData();});
$('hintX').onclick=$('hintOpen').onclick=()=>{store.set('hint',1);$('hint').hidden=true;};
if(!store.get('hint',0))$('hint').hidden=false;
async function restoreCache(){
  const [sh,wy,pt,po]=await Promise.all([kv.get('ships'),kv.get('ways'),kv.get('ports'),kv.get('pois')]);
  if(pt&&pt.data&&pt.box&&Date.now()-pt.at<PORT_TTL){portData=pt.data;portBox=L.latLngBounds([pt.box[0],pt.box[1]],[pt.box[2],pt.box[3]]);portAt=pt.at;}
  if(po&&po.data&&po.box&&Date.now()-po.at<PORT_TTL){poiData=po.data;poiBox=L.latLngBounds([po.box[0],po.box[1]],[po.box[2],po.box[3]]);poiAt=po.at;}
  const gs=store.get('gauges',[]);for(const g of gs)if(g&&g.number!=null)gauges.set(g.number,g);
  if(wy&&wy.els&&wy.box&&Date.now()-wy.at<7*864e5){const net=buildNet(wy.els);if(net.edges.length){WN=net;wver++;wState='ok';wBox=L.latLngBounds([wy.box[0],wy.box[1]],[wy.box[2],wy.box[3]]);wAt=wy.at;}}
  if(sh&&Array.isArray(sh.ships)&&sh.ships.length&&Date.now()-sh.at<3*3600*1000&&!state.ships.size){
    for(const x of sh.ships){x.cat=catOf(x.t);x.name=x.n||'MMSI '+x.m;state.ships.set(x.m,x);}
    state.meta={ok:true,live:true,generated:Math.floor(sh.at/1000)};state.cacheAt=sh.at;
  }
}
paintPlace();paintChips();applySea();
Promise.race([restoreCache(),new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(()=>{render();paintGauges();paintPorts();paintPois();loadData();loadGauges();loadWays();loadPorts();loadPois();loadNews();});
</script>
