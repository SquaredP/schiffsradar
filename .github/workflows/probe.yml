name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: EuRIS NtS v3 Struktur
        run: |
          set +e
          cat > /tmp/p.py <<'PY'
          import json,urllib.request,urllib.parse,sys
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':'schiffsradar'})
              return json.load(urllib.request.urlopen(r,timeout=60))
          B='https://www.eurisportal.eu/api/v3/nts'
          q=B+'?'+urllib.parse.urlencode({'$top':'5','$filter':"countryCode eq 'DE'",'$count':'true'})
          d=get(q)
          print('Top-Level-Keys',list(d.keys()),{k:d[k] for k in d if k!='items'})
          it=d['items']
          print('Anzahl',len(it))
          print('ITEM0',json.dumps(it[0],ensure_ascii=False)[:2500])
          print('keys',sorted(it[0].keys()))
          hid=it[0]['headerId'];sid=it[0]['sectionId']
          for cand in [hid+'_'+sid,hid+'-'+sid,hid+':'+sid,hid+'/'+sid,hid+sid]:
              try:
                  x=get(B+'/'+urllib.parse.quote(cand,safe=''))
                  print('DETAIL ok mit',cand[:12]+'…',json.dumps(x,ensure_ascii=False)[:3500]);break
              except Exception as e: print('DETAIL',cand[:12],'fail',e)
          q2=B+'?'+urllib.parse.urlencode({'$top':'100','$filter':"countryCode eq 'DE' and dateEnd ge 2026-11-24",'$count':'true'})
          d2=get(q2);print('aktuelle DE',len(d2['items']),{k:d2[k] for k in d2 if k!='items'})
          import collections
          print(collections.Counter(i.get('state') for i in d2['items']),collections.Counter(i.get('messageType') for i in d2['items']))
          print('Titel',[i['title'][:60] for i in d2['items'][:5]])
          PY
          python3 /tmp/p.py 2>&1 | cut -c1-3600
