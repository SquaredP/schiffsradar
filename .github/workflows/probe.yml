name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: EuRIS NtS v3 Struktur
        run: |
          set +e
          cat > /tmp/p.py <<'PY'
          import json,urllib.request,urllib.parse,sys
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':'schiffsradar'})
              return json.load(urllib.request.urlopen(r,timeout=60))
          B='https://www.eurisportal.eu/api/v3/nts'
          import collections
          def tryq(f,extra={}):
              p={'$top':'100','$count':'true','$filter':f};p.update(extra)
              try:
                  d=get(B+'?'+urllib.parse.urlencode(p));print('OK',f,'->count',d.get('count'),'items',len(d['items']));return d
              except Exception as e: print('FAIL',f,e);return None
          for f in ["countryCode eq 'DE' and dateEnd ge '2026-11-24'","countryCode eq 'DE' and dateEnd ge 2026-11-24","countryCode eq 'DE' and state eq 80","countryCode eq 'DE' and year eq '2026'","countryCode eq 'DE' and dateEnd ge 2026-11-24T00:00:00Z"]:
              tryq(f)
          d=tryq("countryCode eq 'DE' and year eq '2026'",{'$orderby':'dateIssue desc'})
          if d:
              it=d['items'];print('neueste',it[0]['dateIssue'],it[-1]['dateIssue'])
              act=[i for i in it if i['dateEnd']>='2026-11-24' and i['dateStart']<='2026-11-25']
              print('aktuell von 100:',len(act));print(collections.Counter(f for i in act for f in i['fairways']).most_common(12))
              print(collections.Counter(i['messageTypeMessage'] for i in act),collections.Counter(l for i in act for l in i['limitations']))
              for i in act[:6]: print(i['dateStart'],i['dateEnd'],i['fairways'],json.loads(i['multilanguageTitles']).get('de'),i['limitations'])
          PY
          python3 /tmp/p.py 2>&1 | cut -c1-3600
