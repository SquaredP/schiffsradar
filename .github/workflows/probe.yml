name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: EuRIS NtS v3
        run: |
          set +e
          UA="Mozilla/5.0 schiffsradar-probe"
          echo "== Parameter-Definition"; python3 -c "
          import json,urllib.request
          r=urllib.request.Request('https://www.eurisportal.eu/swagger/docs/NtS_v3',headers={'User-Agent':'x'})
          d=json.load(urllib.request.urlopen(r))
          print(json.dumps(d['paths']['/api/v3/nts'],indent=0)[:1800])
          "
          echo "== Abruf ohne Token"
          curl -sS -m 40 -A "$UA" -H "Origin: https://squaredp.github.io" -D /tmp/h -o /tmp/n.json "https://www.eurisportal.eu/api/v3/nts?pageSize=3" -w "code=%{http_code} size=%{size_download}\n"
          tr -d '\r' < /tmp/h | grep -i "^HTTP\|content-type\|access-control\|www-auth\|vary"
          head -c 2500 /tmp/n.json; echo
          echo "== filters"; curl -sS -m 30 -A "$UA" -o /tmp/f.json "https://www.eurisportal.eu/api/v3/nts/filters" -w "code=%{http_code}\n"; head -c 600 /tmp/f.json; echo
